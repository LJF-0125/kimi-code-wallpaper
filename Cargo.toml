[package]
name = "kimi-bg-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
base64 = "0.22"
rfd = "0.15"
winreg = "0.52"
anyhow = "1"
regex = "1"

[profile.release]
opt-level = 2
lto = true
